[package]
name = "lifeos-desktop"
version = "0.1.0"
description = "Life OS — клиент панели для Arch Linux"
authors = ["Konor11"]
edition = "2021"
rust-version = "1.77.2"

# Имя бинарника. Tauri переиспользует его в .desktop и в пакетах.
[[bin]]
name = "lifeos"
path = "src/main.rs"

[lib]
name = "lifeos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Плагины для настольных платформ. На мобильных они не нужны, поэтому условие по ОС —
# иначе сборка под Android/iOS ломается.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# Без него каждый запуск (и каждое нажатие горячей клавиши) поднимал бы новую копию приложения.
tauri-plugin-single-instance = "2"

[profile.release]
# Панель открыта весь день: важнее размер и скорость, чем время сборки.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
